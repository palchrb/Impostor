name: Build AdminApi Plugin

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/Impostor.Plugins.AdminApi/**'
      - 'src/Impostor.Api/**'
      - '.github/workflows/adminapi-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore src/Impostor.Plugins.AdminApi/Impostor.Plugins.AdminApi.csproj

      - name: Build
        run: dotnet build -c Release --no-restore src/Impostor.Plugins.AdminApi/Impostor.Plugins.AdminApi.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish --no-build src/Impostor.Plugins.AdminApi/Impostor.Plugins.AdminApi.csproj

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Impostor.Plugins.AdminApi
          path: publish/Impostor.Plugins.AdminApi.dll
          if-no-files-found: error

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/adminapi-v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Impostor.Plugins.AdminApi.dll
          draft: true
